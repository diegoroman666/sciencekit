<!doctype html>
<html lang="es" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SciencKit — Minería y análisis de datos{% endblock %}</title>
<meta name="description" content="Herramienta de análisis estadístico: estadística descriptiva, gráficos, regresión lineal y distribución normal. El motor de cálculo está escrito en Python y se ejecuta en el navegador.">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">

<link rel="icon" href="{{ url('static/favicon.svg') }}" type="image/svg+xml">

{# Fonts are self-hosted (scripts/fetch_fonts.py): no third-party request on
   first paint, and the typography survives offline. #}
<link rel="preload" href="{{ url('static/fonts/instrument-sans-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url('static/fonts/jetbrains-mono-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url('static/css/fonts.css') }}">

<link rel="stylesheet" href="{{ url('static/css/app.css') }}">

<script>
  // Resolve the theme before first paint so there is no flash of the wrong one.
  (function () {
    try {
      var saved = localStorage.getItem("sk-theme");
      var dark = saved
        ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
</head>
<body class="min-h-full flex flex-col">
{% block body %}{% endblock %}
</body>
</html>
