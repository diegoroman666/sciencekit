# Netlify build configuration.
#
# The deployed site is fully static: the Python engine in core/ is executed in
# the visitor's browser by Pyodide (CPython compiled to WebAssembly). Netlify
# does not run Python server-side, so there are no functions here.

[build]
  # Las dependencias de Python se instalan explícitamente: build.py usa Jinja2 y
  # aquí no hay virtualenv, así que no se depende de que Netlify detecte solo el
  # requirements.txt.
  command = "python3 -m pip install --quiet -r requirements.txt && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.11"
  # Playwright es una dependencia de desarrollo (tests/e2e.mjs). Netlify instala
  # también las devDependencies, y su postinstall descargaría ~150 MB de
  # navegadores que el build no usa: aquí no se ejecutan pruebas de navegador.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Single page, so anything unresolved falls back to it rather than a 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/core/*"
  [headers.values]
    Content-Type = "text/x-python; charset=utf-8"

[context.deploy-preview]
  command = "python3 -m pip install --quiet -r requirements.txt && npm run build"

[context.production]
  command = "python3 -m pip install --quiet -r requirements.txt && npm run build"
